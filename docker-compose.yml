services:
  mysql:
    image: mysql:8.0
    container_name: olist_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_USER: de_user
      MYSQL_PASSWORD: de_pass
    ports:
      - "3307:3306"          # change to "3307:3306" if port 3306 is already used
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: